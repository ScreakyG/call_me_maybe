[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Francois Gonzalez", email = "francois.gnz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flake8>=7.3.0",
    "llm-sdk",
    "mypy>=2.3.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
]

[tool.mypy]
exclude= [
    "llm_sdk"
]

[tool.flake8]
extend-exclude = [
    ".venv",
    "llm_sdk"
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[dependency-groups]
dev = [
    "flake8-pyproject>=1.2.4",
]
